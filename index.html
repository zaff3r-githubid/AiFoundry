<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IdeaDrop · AI‑Powered Idea Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0C10;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1rem;
            color: #EFF1F5;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
        }

        .card {
            background: #13161C;
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid #2A2F3A;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #FFFFFF 0%, #A9B8E8 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.4rem;
        }

        .sub {
            color: #8F9BB3;
            margin-bottom: 2rem;
            border-left: 3px solid #3B82F6;
            padding-left: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #CBD5E1;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background: #1E222B;
            border: 1px solid #2D3240;
            border-radius: 1rem;
            color: white;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .file-label {
            background: #1E222B;
            border: 1px dashed #3B82F6;
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .file-label:hover {
            background: #262C38;
        }

        input[type="file"] {
            display: none;
        }

        .webhook-row {
            background: #0F1117;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1rem;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .webhook-row input {
            flex: 3;
            margin-bottom: 0;
            font-family: monospace;
            font-size: 0.8rem;
        }

        button {
            background: #3B82F6;
            border: none;
            padding: 0.85rem 1.4rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        button:hover {
            background: #2563EB;
            transform: scale(0.98);
        }

        .submit-btn {
            width: 100%;
            margin-top: 0.5rem;
            padding: 1rem;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            margin-top: 1.2rem;
            padding: 0.8rem;
            border-radius: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .success { background: #0B2E1A; color: #6EE7B7; border: 1px solid #15803D; }
        .error { background: #2C1115; color: #FCA5A5; border: 1px solid #B91C1C; }

        hr {
            border-color: #2A2F3A;
            margin: 1.5rem 0;
        }

        small {
            color: #6C7A91;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>✧ IdeaDrop ✧</h1>
        <div class="sub">Your AI‑powered idea incubator → enriched by Claude, stored in Notion</div>

        <!-- Webhook configuration (saved in localStorage) -->
        <div class="form-group">
            <label>🔌 Make.com Webhook URL</label>
            <div class="webhook-row">
                <input type="url" id="webhookUrl" placeholder="https://hook.make.com/xxxxxx" value="">
                <button id="saveWebhookBtn" style="background:#2D3240;">Save</button>
            </div>
            <small>Paste your Make.com webhook URL once, it will be remembered.</small>
        </div>

        <hr>

        <form id="ideaForm">
            <div class="form-group">
                <label>💡 Idea Title *</label>
                <input type="text" id="title" required placeholder="e.g., Contextual chain‑of‑thought routing">
            </div>

            <div class="form-group">
                <label>👤 Submitted By</label>
                <input type="text" id="submittedBy" placeholder="Your name (optional)">
            </div>

            <div class="form-group">
                <label>📂 Category *</label>
                <select id="category" required>
                    <option value="">-- Select category --</option>
                    <option>Model Architecture</option>
                    <option>Prompt Engineering</option>
                    <option>Data Pipeline</option>
                    <option>AI Application</option>
                    <option>Tool/Framework</option>
                    <option>Research Direction</option>
                    <option>Ethics & Safety</option>
                    <option>Business Use Case</option>
                </select>
            </div>

            <div class="form-group">
                <label>📝 Description (what's the idea?) *</label>
                <textarea id="description" required placeholder="Describe the idea, its impact, and any context..."></textarea>
            </div>

            <div class="form-group">
                <label>📎 Attachment (max 10MB: PPTX, PDF, DOCX, JPG, PNG)</label>
                <div class="file-label" onclick="document.getElementById('fileInput').click()">
                    📁 Click to upload or drag & drop
                </div>
                <input type="file" id="fileInput" accept=".pptx,.pdf,.docx,.jpg,.png">
                <div id="fileName" style="margin-top: 0.4rem; font-size:0.75rem; color:#8F9BB3;"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                ✨ Submit & let Claude analyze ✨
            </button>
            <div id="formMessage"></div>
        </form>
    </div>
</div>

<script>
    // ---------- LocalStorage for webhook URL ----------
    const webhookInput = document.getElementById('webhookUrl');
    const saveBtn = document.getElementById('saveWebhookBtn');

    // Load saved webhook
    const savedWebhook = localStorage.getItem('ideadrop_webhook');
    if (savedWebhook) webhookInput.value = savedWebhook;

    saveBtn.addEventListener('click', () => {
        const url = webhookInput.value.trim();
        if (url && url.startsWith('https://')) {
            localStorage.setItem('ideadrop_webhook', url);
            showMessage('Webhook saved!', 'success');
        } else {
            showMessage('Enter a valid https:// hook URL', 'error');
        }
    });

    // ---------- File handling ----------
    const fileInput = document.getElementById('fileInput');
    const fileNameSpan = document.getElementById('fileName');
    let currentBase64 = null;

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) {
            showMessage('File too large (max 10MB)', 'error');
            fileInput.value = '';
            return;
        }
        const allowed = ['.pptx','.pdf','.docx','.jpg','.png'];
        const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
        if (!allowed.includes(ext)) {
            showMessage('Invalid file type', 'error');
            fileInput.value = '';
            return;
        }
        fileNameSpan.innerText = `📎 ${file.name}`;
        currentBase64 = await fileToBase64(file);
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // ---------- Form submission ----------
    const form = document.getElementById('ideaForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('formMessage');

    function showMessage(msg, type) {
        messageDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
        setTimeout(() => {
            if (messageDiv.innerHTML.includes(msg)) messageDiv.innerHTML = '';
        }, 5000);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const webhookUrl = localStorage.getItem('ideadrop_webhook');
        if (!webhookUrl || !webhookUrl.startsWith('https://')) {
            showMessage('Please save a valid Make.com webhook URL first', 'error');
            return;
        }

        const title = document.getElementById('title').value.trim();
        const submittedBy = document.getElementById('submittedBy').value.trim() || "Anonymous";
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value.trim();

        if (!title || !category || !description) {
            showMessage('Title, Category and Description are required', 'error');
            return;
        }

        // Prepare payload
        const payload = {
            title: title,
            submitted_by: submittedBy,
            category: category,
            description: description,
            attachment_base64: currentBase64 || null,
            attachment_name: fileInput.files[0] ? fileInput.files[0].name : null,
            submitted_at: new Date().toISOString()
        };

        // Disable button & show loading
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Analyzing with Claude...';

        try {
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            showMessage('✅ Idea delivered! Claude’s analysis will appear in Notion shortly.', 'success');
            form.reset();
            fileNameSpan.innerText = '';
            currentBase64 = null;
            document.getElementById('submittedBy').value = '';
        } catch (err) {
            console.error(err);
            showMessage('❌ Submission failed. Check webhook URL or network.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '✨ Submit & let Claude analyze ✨';
        }
    });
</script>
</body>
</html>
