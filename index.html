<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IdeaDrop v1.0 · Intelligence-Augmented Capture</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0E14;
            --card-bg: rgba(22, 27, 34, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3B82F6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #F0F6FC;
            --text-dim: #8B949E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #1e2631 0%, #0B0E14 60%);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 850px;
            animation: fadeIn 0.8s ease-out;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 3rem;
            border: 1px solid var(--border);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* Subtle top highlight */
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #fff;
        }

        .sub {
            color: var(--text-dim);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .form-group { margin-bottom: 1.8rem; }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.6rem;
            color: var(--accent);
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        textarea { min-height: 140px; }

        /* The Custom File Upload */
        .file-zone {
            border: 1px dashed var(--border);
            padding: 1.5rem;
            border-radius: 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255,255,255,0.02);
        }

        .file-zone:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.03);
        }

        .webhook-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0.5;
        }

        #webhookPanel {
            display: none;
            background: #000;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--accent);
        }

        .submit-btn {
            grid-column: span 2;
            background: #fff;
            color: #000;
            border: none;
            padding: 1.2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background: #161B22;
            color: #484F58;
            cursor: not-allowed;
            transform: none;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .submit-btn { grid-column: span 1; }
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <button class="webhook-toggle" onclick="toggleWebhook()" title="Settings">⚙</button>
        
        <h1>✧ IDEADROP v1.0 ✧</h1>
        <div class="sub">Neural Archiving Engine — Intelligence-Augmented Capture</div>

        <div id="webhookPanel">
            <label>System Endpoint (Webhook URL)</label>
            <div style="display: flex; gap: 10px;">
                <input type="url" id="webhookUrl" placeholder="https://hook.make.com/...">
                <button onclick="saveWebhook()" style="padding:0 15px; background:var(--accent); color:white; border-radius:4px; border:none;">SAVE</button>
            </div>
        </div>

        <form id="ideaForm" class="form-grid">
            <div class="left-col">
                <div class="form-group">
                    <label>Identification / Title</label>
                    <input type="text" id="title" required placeholder="Concept Name">
                </div>

                <div class="form-group">
                    <label>Originator / Source</label>
                    <input type="text" id="submittedBy" placeholder="Anonymous">
                </div>

                <div class="form-group">
                    <label>Classification</label>
                    <select id="category" required>
                        <option value="">Select Domain</option>
                        <option>Model Architecture</option>
                        <option>Prompt Engineering</option>
                        <option>Data Pipeline</option>
                        <option>AI Application</option>
                        <option>Tool/Framework</option>
                        <option>Research Direction</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Data Transfer</label>
                    <div class="file-zone" onclick="document.getElementById('fileInput').click()">
                        <span id="fileName">Select or Drop Assets</span>
                    </div>
                    <input type="file" id="fileInput" hidden accept=".pptx,.pdf,.docx,.jpg,.png">
                </div>
            </div>

            <div class="right-col">
                <div class="form-group">
                    <label>Conceptual Brief</label>
                    <textarea id="description" required placeholder="Outline the impact and context of the idea..."></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Initialize Processing
            </button>
        </form>
        <div id="formMessage"></div>
    </div>
</div>

<script>
    // Webhook Management
    function toggleWebhook() {
        const p = document.getElementById('webhookPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function saveWebhook() {
        const url = document.getElementById('webhookUrl').value.trim();
        if (url.startsWith('https://')) {
            localStorage.setItem('ideadrop_webhook', url);
            alert('Endpoint Synchronized');
            toggleWebhook();
        }
    }

    // Load saved webhook
    const savedWebhook = localStorage.getItem('ideadrop_webhook');
    if (savedWebhook) document.getElementById('webhookUrl').value = savedWebhook;

    // File Handling
    const fileInput = document.getElementById('fileInput');
    const fileNameSpan = document.getElementById('fileName');
    let currentBase64 = null;

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileNameSpan.innerText = file.name.toUpperCase();
        currentBase64 = await fileToBase64(file);
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // Submission Logic
    const form = document.getElementById('ideaForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const webhookUrl = localStorage.getItem('ideadrop_webhook');
        if (!webhookUrl) {
            alert('Error: No System Endpoint defined.');
            toggleWebhook();
            return;
        }

        const payload = {
            title: document.getElementById('title').value,
            submitted_by: document.getElementById('submittedBy').value || "Anonymous",
            category: document.getElementById('category').value,
            description: document.getElementById('description').value,
            attachment_base64: currentBase64,
            attachment_name: fileInput.files[0]?.name || null,
            submitted_at: new Date().toISOString()
        };

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Executing...';

        try {
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                submitBtn.innerHTML = 'SUCCESS';
                submitBtn.style.background = '#059669';
                setTimeout(() => {
                    form.reset();
                    fileNameSpan.innerText = 'Select or Drop Assets';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Initialize Processing';
                    submitBtn.style.background = '#fff';
                }, 3000);
            }
        } catch (err) {
            alert('Transmission Interrupted');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Initialize Processing';
        }
    });
</script>
</body>
</html>
